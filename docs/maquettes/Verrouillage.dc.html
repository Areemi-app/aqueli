</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    let seed = 7;
    const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
    const stars = [];
    for (let i = 0; i < 70; i++) {
      const r = rnd() < 0.12 ? 3 : (rnd() < 0.5 ? 2 : 1);
      stars.push({ x: Math.round(rnd() * 1270), y: Math.round(rnd() * 640), r, o: (0.35 + rnd() * 0.6).toFixed(2), glow: r * 3 });
    }
    const sparkles = [
      { x: 180, y: 150, size: 18, color: '#b6f03c' },
      { x: 1040, y: 120, size: 16, color: '#ff5fa8' },
      { x: 1110, y: 520, size: 14, color: '#2fd6c9' },
      { x: 250, y: 560, size: 12, color: '#b04cff' }
    ];
    return { stars, sparkles };
  }
}
</script>
