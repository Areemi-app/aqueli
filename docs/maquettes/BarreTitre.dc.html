<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["aqua","prairie","automne","nuit"],"default":"aqua"},"$preview":{"width":1280,"height":52}}'>
const AQ_GLOSS = 'radial-gradient(120% 90% at 50% -20%, rgba(255,255,255,0.42) 0%, rgba(255,255,255,0.12) 55%, rgba(255,255,255,0) 70%)';
const AQ_THEMES = {

  prairie: { name: 'Prairie', bar: 'linear-gradient(180deg, rgba(255,255,255,0.88) 0%, rgba(255,255,255,0.58) 100%)', field: 'rgba(255,255,255,0.9)', border: 'rgba(255,255,255,0.95)', ink: '#12321a', soft: '#3a5a40', line: 'rgba(18,50,26,0.18)', gel: AQ_GLOSS + ', linear-gradient(180deg, #47ab27 0%, #1b6810 100%)', glow: 'rgba(27,104,16,0.5)', seg: '#ffffff' },
  automne: { name: 'Automne', bar: 'linear-gradient(180deg, rgba(255,250,240,0.9) 0%, rgba(255,244,228,0.62) 100%)', field: 'rgba(255,251,245,0.92)', border: 'rgba(255,250,240,0.95)', ink: '#3a1a0a', soft: '#6a3b22', line: 'rgba(58,26,10,0.18)', gel: AQ_GLOSS + ', linear-gradient(180deg, #e07833 0%, #983b0c 100%)', glow: 'rgba(152,59,12,0.5)', seg: '#fffaf3' },
  nuit: { name: 'Nuit étoilée', bar: 'linear-gradient(180deg, rgba(40,72,160,0.7) 0%, rgba(10,22,64,0.62) 100%)', field: 'rgba(8,18,52,0.78)', border: 'rgba(150,200,255,0.32)', ink: '#eef5ff', soft: '#b4c8e8', line: 'rgba(200,220,255,0.25)', gel: AQ_GLOSS + ', linear-gradient(180deg, #3c92f2 0%, #1a45b5 100%)', glow: 'rgba(70,150,255,0.6)', seg: 'rgba(110,170,255,0.32)' }
};
class Component extends DCLogic {
  renderVals() {
    const key = AQ_THEMES[this.props.theme] ? this.props.theme : 'aqua';
    return { t: AQ_THEMES[key] };
  }
}
</script>
