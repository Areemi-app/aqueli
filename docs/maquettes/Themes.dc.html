<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Galerie des thèmes Aqueli</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1692px; height: 1796px; box-sizing: border-box; padding: 48px; display: flex; flex-direction: column; gap: 32px; background: radial-gradient(60% 30% at 85% 0%, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%), linear-gradient(180deg, #d6f0fc 0%, #eef8fe 40%, #f7fbff 100%); font-family: 'Figtree', 'Segoe UI Variable', 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; color: #0b2a45">
<div style="height: 96px; display: flex; align-items: center; gap: 20px">
<img src="/_blob/858e20c7d306c68197423b1098f549f3" alt="" style="width: 80px; height: 80px">
<div style="flex-grow: 1">
<h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em">Galerie des thèmes</h1>
<p style="margin: 4px 0 0 0; font-size: 17px; font-weight: 500; color: #3a5870">20 thèmes, chacun en clair ou en sombre · changement automatique possible selon la saison, les fêtes, l'heure ou l'humeur du Journal</p>
</div>
</div>
<sc-for list="{{families}}" as="fam" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0; height: 24px; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: #3a5870">{{fam.label}}</h2>
<div style="display: flex; gap: 24px">
<sc-for list="{{fam.themes}}" as="th" hint-placeholder-count="5">
<article style="width: 300px; height: 256px; box-sizing: border-box; display: flex; flex-direction: column; border-radius: 18px; background: rgba(255,255,255,0.75); border: 1px solid rgba(255,255,255,0.95); box-shadow: 0 10px 30px rgba(6,68,120,0.12); overflow: hidden">
<div style="position: relative; width: 300px; height: 180px; overflow: hidden; background: {{th.sky}}">
<sc-for list="{{th.motifs}}" as="m" hint-placeholder-count="6">
<svg aria-hidden="true" width="{{m.s}}" height="{{m.s}}" viewBox="0 0 24 24" style="position: absolute; left: {{m.x}}px; top: {{m.y}}px; opacity: {{m.o}}"><path d="{{m.d}}" fill="{{m.fill}}" stroke="{{m.stroke}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</sc-for>
<div style="position: absolute; left: 0; top: 0; width: 300px; height: 22px; box-sizing: border-box; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: {{th.bar}}; border-bottom: 1px solid {{th.border}}; color: {{th.ink}}; font-size: 10px; font-weight: 700">
<span style="width: 10px; height: 10px; border-radius: 5px; background: {{th.gel}}"></span>Aqueli
</div>
<div style="position: absolute; left: 12px; top: 32px; width: 176px; height: 136px; box-sizing: border-box; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; border-radius: 12px; background: {{th.card}}; backdrop-filter: blur(10px); border: 1px solid {{th.border}}; color: {{th.ink}}">
<div style="font-size: 11px; font-weight: 700">Aujourd'hui</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 500"><span style="width: 10px; height: 10px; flex-shrink: 0; border-radius: 5px; background: {{th.gel}}"></span><span style="color: {{th.soft}}; text-decoration: line-through">Arroser les plantes</span></div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600"><span style="width: 10px; height: 10px; box-sizing: border-box; flex-shrink: 0; border-radius: 5px; border: 1.2px solid {{th.soft}}"></span>Appeler le garage</div>
<div style="display: flex; align-items: center; gap: 6px; font-size: 10px; font-weight: 600"><span style="width: 10px; height: 10px; box-sizing: border-box; flex-shrink: 0; border-radius: 5px; border: 1.2px solid {{th.soft}}"></span>Préparer la réunion</div>
<span style="margin-top: auto; align-self: flex-start; height: 22px; padding: 0 12px; border-radius: 11px; background: {{th.gel}}; border: 1px solid rgba(255,255,255,0.28); box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 12px -6px {{th.glow}}; color: #ffffff; font-size: 10px; font-weight: 700; line-height: 22px">Planifier</span>
</div>
<div style="position: absolute; left: 198px; top: 32px; width: 90px; height: 60px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; background: {{th.card}}; backdrop-filter: blur(10px); border: 1px solid {{th.border}}; color: {{th.ink}}">
<span style="font-size: 17px; font-weight: 700; line-height: 1">25:00</span>
<span style="margin-top: 3px; font-size: 9px; font-weight: 600; color: {{th.accent}}">Focus</span>
</div>
</div>
<div style="flex-grow: 1; display: flex; align-items: center; gap: 10px; padding: 0 16px">
<div style="flex-grow: 1; min-width: 0">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-size: 16px; font-weight: 700">{{th.name}}</span><sc-if value="{{th.dark}}" hint-placeholder-val="{{false}}"><span style="padding: 1px 7px; border-radius: 8px; background: #0b2a45; color: #ffffff; font-size: 10px; font-weight: 700">sombre</span></sc-if></div>
<div style="margin-top: 2px; font-size: 12px; font-weight: 500; color: #3a5870; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{th.auto}}</div>
</div>
<div style="display: flex; gap: 4px" aria-label="Palette" role="img">
<sc-for list="{{th.swatches}}" as="c" hint-placeholder-count="4">
<span style="width: 16px; height: 16px; border-radius: 8px; background: {{c.color}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12)"></span>
</sc-for>
</div>
</div>
</article>
</sc-for>
</div>
</section>
</sc-for>
</div>
</x-dc>
