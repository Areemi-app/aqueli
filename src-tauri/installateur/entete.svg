<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 57" width="150" height="57">
  <!-- En-tête des pages de l'installateur (150 × 57), à droite du titre : reflet irisé autour du
       logo, qui se fond à gauche dans le fond de l'en-tête (MUI_BGCOLOR « F3F9FF », crochets.nsh).
       Rendu en entete.bmp (24 bits). -->
  <defs>
    <linearGradient id="fond" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3f9ff"/>
      <stop offset="0.45" stop-color="#e2f3ff"/>
      <stop offset="1" stop-color="#a9dcfa"/>
    </linearGradient>
    <filter id="flou" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
    <linearGradient id="bord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.35" stop-color="#bfefff"/>
      <stop offset="0.55" stop-color="#d8c8ff"/>
      <stop offset="0.75" stop-color="#ffd0e8"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="150" height="57" fill="url(#fond)"/>
  <g filter="url(#flou)">
    <ellipse cx="146" cy="6" rx="22" ry="16" fill="#b8a8ff" opacity="0.6"/>
    <ellipse cx="100" cy="50" rx="24" ry="14" fill="#ffb0d6" opacity="0.45"/>
    <ellipse cx="128" cy="56" rx="22" ry="12" fill="#9ff0cf" opacity="0.6"/>
    <ellipse cx="80" cy="12" rx="20" ry="10" fill="#5fe0f0" opacity="0.4"/>
  </g>
  <circle cx="124" cy="28.5" r="24" fill="#ffffff" fill-opacity="0.25" stroke="url(#bord)" stroke-width="1"/>
  <image href="../../assets/logo/aqueli-logo-512.png" x="103" y="7.5" width="42" height="42"/>
</svg>
