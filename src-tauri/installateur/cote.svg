<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 164 314" width="164" height="314">
  <!-- Bandeau des pages d'accueil et de fin de l'installateur (164 × 314) : ciel Aqua parcouru
       d'un reflet irisé (halos flous aqua, lilas, rose, menthe, or pâle, voile nacré en diagonale),
       logo sur un disque de verre au bord irisé. Rendu en cote.bmp (24 bits), voir LISEZ-MOI.md. -->
  <defs>
    <linearGradient id="ciel" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1c86dc"/>
      <stop offset="0.5" stop-color="#46acec"/>
      <stop offset="1" stop-color="#9bd8f6"/>
    </linearGradient>
    <filter id="flou" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="flou-doux" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <!-- Voile nacré : bandes très douces qui changent de teinte, comme une feuille holographique. -->
    <linearGradient id="nacre" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#c9f3ff" stop-opacity="0.32"/>
      <stop offset="0.42" stop-color="#e6d6ff" stop-opacity="0.38"/>
      <stop offset="0.54" stop-color="#ffd9ec" stop-opacity="0.32"/>
      <stop offset="0.66" stop-color="#d9ffef" stop-opacity="0.28"/>
      <stop offset="0.8" stop-color="#fff3c9" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Bord irisé du disque de verre. -->
    <linearGradient id="bord" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#bfefff"/>
      <stop offset="0.5" stop-color="#d8c8ff"/>
      <stop offset="0.7" stop-color="#ffd0e8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="verre" cx="0.4" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.22"/>
    </radialGradient>
    <linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="164" height="314" fill="url(#ciel)"/>

  <!-- Halos irisés, très flous. -->
  <g filter="url(#flou)">
    <ellipse cx="150" cy="40" rx="70" ry="60" fill="#b8a8ff" opacity="0.65"/>
    <ellipse cx="10" cy="150" rx="60" ry="70" fill="#5fe0f0" opacity="0.6"/>
    <ellipse cx="150" cy="210" rx="60" ry="70" fill="#ffb0d6" opacity="0.5"/>
    <ellipse cx="40" cy="300" rx="80" ry="50" fill="#9ff0cf" opacity="0.65"/>
    <ellipse cx="130" cy="320" rx="60" ry="40" fill="#ffe7a0" opacity="0.55"/>
  </g>

  <!-- Voile nacré en diagonale, deux passes décalées. -->
  <rect x="-60" y="-20" width="300" height="140" fill="url(#nacre)" transform="rotate(32 82 157)" filter="url(#flou-doux)"/>
  <rect x="-60" y="170" width="300" height="110" fill="url(#nacre)" transform="rotate(32 82 157)" filter="url(#flou-doux)" opacity="0.8"/>

  <!-- Disque de verre et logo. -->
  <circle cx="82" cy="122" r="54" fill="url(#verre)" stroke="url(#bord)" stroke-width="1.6"/>
  <path d="M42 104 A44 44 0 0 1 112 86" stroke="url(#reflet)" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
  <image href="../../assets/logo/aqueli-logo-512.png" x="42" y="82" width="80" height="80"/>

  <!-- Nom. -->
  <text x="82" y="214" text-anchor="middle" font-family="Figtree, 'Segoe UI Variable', 'Segoe UI', sans-serif" font-size="24" font-weight="750" fill="#ffffff" letter-spacing="0.4" style="paint-order: stroke" stroke="#0a4f96" stroke-opacity="0.18" stroke-width="2">Aqueli</text>
  <!-- Fin trait irisé sous le nom. -->
  <rect x="62" y="224" width="40" height="2" rx="1" fill="url(#bord)"/>
</svg>
